    <!-- What crawlers and link unfurlers that don't run JavaScript read. Browsers with JS never paint it. -->
    <noscript><main>
      <h1>GuessHog: Guess Who, with hedgehogs</h1>
      <p>Two players, 24 PostHog hedgehogs, one secret each. Ask yes-or-no questions and find your opponent's hog first. Free, in the browser, and friends can watch.</p>
      <h2>How to play</h2>
      <ol>
        <li><strong>Grab seats.</strong> Create a room and send the four-letter code to a friend. Two players sit down. Everyone else watches from the stands and sees both boards.</li>
        <li><strong>Ask away.</strong> Take turns asking yes-or-no questions about the other player's secret hog, and flip down the hogs it can't be.</li>
        <li><strong>Call it.</strong> When you think you know, guess their hog. A wrong guess loses the round.</li>
      </ol>
      <p>Made by <a href="https://posthog.com">PostHog</a> with the hoggies from <a href="https://brand.posthog.com">PostHog Brand</a>. <a href="https://github.com/PostHog/guesshog">Source on GitHub</a>.</p>
